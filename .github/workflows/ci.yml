name: CI Streamlit Sanity & Requirements Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate requirements.txt
        run: |
          python -c "
          with open('requirements.txt', 'r', encoding='utf-8') as f:
              lines = [l.strip() for l in f if l.strip() and not l.startswith('#')]
          print(f'Parsed {len(lines)} requirements packages')
          "
      - name: Syntax compile streamlit_app.py
        run: |
          python -c "
          import os, py_compile
          if os.path.exists('streamlit_app.py'):
              py_compile.compile('streamlit_app.py')
              print('streamlit_app.py compiled successfully!')
          "
